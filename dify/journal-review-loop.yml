      type: custom
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      width: 244
      height: 90
      data:
        type: start
        title: 開始
        desc: ''
        selected: false
        variables:
        - variable: manuscript
          label: 貼上稿件全文（含參考文獻）。也可改為上傳檔案
          type: paragraph
          required: false
          max_length: 200000
          options: []
        - variable: file
          label: 或上傳稿件檔案（PDF／Word）。★教學實踐研究計畫書預審：請把「計畫書本文」上傳或貼在這裡；若上方已貼上文字，則以貼上的文字為準
          type: file
          required: false
          max_length: 1
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          - .docx
          - .doc
          allowed_file_upload_methods:
          - local_file
          - remote_url
        - variable: paper_type
          label: 論文類型（teaching_practice_proposal=教學實踐研究計畫書預審、quantitative=量化、qualitative=質性、theoretical=理論／政策分析、teaching_practice=教學實踐、mixed=混合方法、content_analysis=內容分析、historical=歷史途徑、institutional_comparison=制度比較、cross_cultural=跨文化研究、literature_linguistics=文學與語言研究）
          type: select
          required: true
          max_length: 64
          options:
          - quantitative
          - qualitative
          - theoretical
          - teaching_practice
          - mixed
          - content_analysis
          - historical
          - institutional_comparison
          - cross_cultural
          - literature_linguistics
          - teaching_practice_proposal
        - variable: format_source
          label: 期刊格式來源（選「上傳期刊格式檔」時，請在下一欄上傳稿約或格式說明）
          type: select
          required: true
          max_length: 32
          options:
          - 內建預設格式
          - 上傳期刊格式檔
          default: 內建預設格式
        - variable: journal_file
          label: 期刊格式檔（稿約／投稿須知，PDF 或 Word；僅在上一欄選「上傳期刊格式檔」時使用）
          type: file
          required: false
          max_length: 1
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          - .docx
          - .doc
          allowed_file_upload_methods:
          - local_file
          - remote_url
        - variable: known_gaps
          label: 作者已知待補事項（選填；每行一項。例如：質性分析程序細節、補充實證文獻。列在此處的缺口，審查者仍會提出，但嚴重度最高為 minor，不會阻擋通過）
          type: paragraph
          required: false
          max_length: 3000
          options: []
        - variable: course_plan
          label: 【計畫書預審・僅限「授課計畫書」，不是計畫書本文】貼上授課計畫書全文（選填；沒有可留空）
          type: paragraph
          required: false
          max_length: 100000
          options: []
        - variable: course_plan_file
          label: 【計畫書預審・僅限「授課計畫書」，不是計畫書本文】或上傳授課計畫書（PDF／Word；選填）
          type: file
          required: false
          max_length: 1
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          - .docx
          - .doc
          allowed_file_upload_methods:
          - local_file
          - remote_url
        - variable: prior_plan
          label: 【計畫書預審・選填】貼上「前期／相關計畫書」全文（例如本計畫所延續的上一年度計畫書；用來核對「延續與差異對照表」是否與原文相符。沒有可留空）
          type: paragraph
          required: false
          max_length: 100000
          options: []
        - variable: prior_plan_file
          label: 【計畫書預審・選填】或上傳前期／相關計畫書（PDF／Word）
          type: file
          required: false
          max_length: 1
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          - .docx
          - .doc
          allowed_file_upload_methods:
          - local_file
          - remote_url
        - variable: local_checks
          label: 【計畫書預審】本機檢查結果（選填；貼上 proposal_checks.py 的報告，內含精確頁數與歷年計畫書重複比對）
          type: paragraph
          required: false
          max_length: 60000
          options: []
        - variable: max_rounds
          label: 輪數上限
          type: number
          required: true
          max_length: 48
          options: []
          default: 4
        - variable: required_pass_rounds
          label: 需連續通過輪數
          type: number
          required: true
          max_length: 48
          options: []
          default: 2
