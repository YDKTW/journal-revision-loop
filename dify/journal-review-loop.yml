  name: 期刊稿件審查與修訂迴圈
  mode: workflow
  icon: 📝
  icon_background: '#FFEAD5'
  description: Gemini＋GPT 審查，Claude 修稿，程式碼判斷停止條件；含教學實踐研究計畫書預審模式
  use_icon_as_answer_icon: false
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables:
  - id: f80a66c5-fee5-47c0-8d2c-71ad79b661a6
    name: RUBRIC
    selector:
    - env
    - RUBRIC
    value: |
      # 期刊審查標準（Review Rubric）v0.2（通用研究論文版）

      > 用途：三個模型（Gemini、GPT、Claude）共用的唯一審查基準。
      > 適用稿件：一般學術研究論文（實證量化、質性、混合方法、理論／文獻／政策分析、教學實踐研究）。
      > **使用前必做**：
      > 1. 在第六節填入目標期刊的官方規範，並以官方《審查表》項目覆蓋本表的衝突之處。
      > 2. 在稿件資訊中指定「論文類型」，系統將依第三節載入對應的類型模組。

      ---

      ## 一、通用評分面向與權重

      每個面向以 1–5 分評定。

      | 代號 | 面向 | 預設權重 | 主要審查者 |
      |---|---|---|---|
      | A | 研究問題與貢獻定位 | 15% | Gemini |
      | B | 文獻回顧與理論架構 | 15% | GPT |
      | C | 研究設計與方法（含研究倫理） | 20% | Gemini |
      | D | 證據與分析 | 20% | Gemini |
      | E | 論證與討論 | 15% | Gemini |
      | F | 結論、貢獻與意涵 | 10% | Gemini |
      | G | 寫作、格式與引註 | 5% | GPT |

      「主要審查者」代表責任分工：審查A（方法與論證）負責 A、C、D、E、F；審查B（文獻與格式）負責 B、G。**綜合分數以主責審查者的分數為主（75%），另一位僅供參考（25%）**，避免非本行的審查者給分偏寬而墊高整體分數。另一方發現其他面向的重大問題時，仍可提出意見。
      **面向分數上限**：任一面向只要有未解決的 major 意見（不論由哪位審查者提出），該面向的綜合分數上限為 3.5；有未解決的 critical 則上限為 2.5。標示為【已知待補】的意見不觸發上限。權重可依論文類型調整（見第三節）。

      ---

      ## 二、各面向評分錨點（通用）

      ### A 研究問題與貢獻定位
      - **5**：研究問題具體、可檢驗或可論證；研究缺口有文獻依據；明確說明對學術或實務的貢獻；與期刊定位相符。
      - **3**：問題大致清楚，但範圍過大、缺口論證不足，或貢獻陳述空泛。
      - **1**：沒有明確研究問題，或只是主題介紹。

      ### B 文獻回顧與理論架構
      - **5**：文獻與研究問題直接相關，能整合與批判而非羅列；理論或分析架構貫穿全文；涵蓋該領域關鍵文獻與近期研究。
      - **3**：文獻相關，但偏羅列；理論與後文分析連結鬆散。
      - **1**：文獻明顯不足、與主題無關，或疑有不存在的文獻。

      ### C 研究設計與方法
      - **5**：研究設計與研究問題相稱；對象、資料來源、蒐集與分析程序交代完整，可被他人檢驗或重現；研究倫理（涉及人類受試者時的審查、知情同意、去識別化）交代清楚。
      - **3**：方法大致交代，但關鍵細節缺漏（如樣本、案例選擇理由、工具信效度、資料來源取得方式）。
      - **1**：看不出研究如何進行，或應有倫理說明而缺漏。

      ### D 證據與分析
      - **5**：證據充分，且與研究問題一一對應；分析過程透明；數據、引述、史料或個案與正文一致；考慮替代解釋。
      - **3**：有證據，但對應不完整，或分析停留在描述。
      - **1**：證據不足以支持主要發現，或數據、事實前後不一致。

      ### E 論證與討論
      - **5**：結論由證據推出；相關與因果、描述與推論區分清楚；與既有文獻對話；研究限制誠實交代；無過度推論。
      - **3**：結論大致合理，但部分推論超出證據，限制說明流於形式。
      - **1**：結論與證據脫節。

      ### F 結論、貢獻與意涵
      - **5**：結論回應研究問題；清楚說明理論、政策、實務或教學意涵，並指出適用範圍與條件；後續研究方向具體。
      - **3**：結論重述多於推進；意涵泛泛。
      - **1**：結論未回應研究問題，或僅為成果宣傳。

      ### G 寫作、格式與引註
      - **5**：結構完整、語句精確、學術語氣穩定；引註與參考文獻格式一致且互相對應；圖表規範。
      - **3**：偶有冗贅或格式不一致。
      - **1**：格式大量錯誤，或正文引註與參考文獻對不上。

      ---

      ## 三、論文類型模組

      稿件資訊須指定一種主類型（可加註次類型）。審查者在通用錨點之外，另加檢查下列項目；權重調整僅在該類型下生效。

      ### 類型 1：實證量化研究
      - 抽樣方法、樣本代表性與樣本數是否合理
      - 變項定義與測量工具的信效度
      - 統計方法是否適當、前提假設是否檢驗、效果量與信賴區間是否報告
      - 是否區分統計顯著與實質意義
      - 權重調整建議：C 25%、D 25%、B 10%、F 5%

      ### 類型 2：質性研究
      - 研究取徑與方法論立場是否交代
      - 參與者選擇、飽和或充分性的判準
      - 編碼與分析程序透明度；研究者立場與反身性
      - 可信賴性策略（三角檢證、成員檢核等）
      - 引述是否具代表性，而非只選有利者
      - 權重調整建議：C 25%、D 20%、E 15%

      ### 類型 3：理論／文獻／政策分析（含個案與歷史研究）
      - 分析架構或概念工具是否明確並被實際運用
      - 史料、文本或個案的選擇理由與來源可靠度
      - 是否處理反例與替代解釋
      - 論證是否有內在一致性與邏輯層次
      - 權重調整建議：B 20%、D 20%、E 20%、C 10%（C 重點改為資料選擇與分析途徑）

      ### 類型 4：教學實踐研究
      - 教學問題脈絡與教學設計的理據
      - 教學策略、實施流程與評量工具是否具體
      - 學習成效證據與教學歷程的對應
      - 教學反思是否具批判性，以及可轉移的條件
      - 權重調整建議：C 20%、D 20%、F 15%（F 重點為教學反思與實務貢獻）

      ### 類型 5：混合方法（mixed）
      - 同時適用類型 1 與類型 2 的檢查項目
      - 量化與質性結果如何整合、是否互相印證或說明矛盾

      ### 類型 6：內容分析（content_analysis）
      - **研究問題與分析單位**：研究問題或假設是否可由文本資料回答；分析單位（字、句、段、則、篇）是否明確界定。
      - **文本母體與抽樣**：資料來源、時間範圍、納入與排除標準、抽樣方法是否交代；是否可能有選擇偏誤（例如平臺演算法、版本、可近性）。
      - **編碼架構**：類目是否互斥且窮盡，是否有操作型定義與編碼手冊，類目與理論構念如何對應。
      - **編碼者與信度**：編碼者人數與訓練、是否先行試編、是否報告編碼者間信度（如 Cohen's κ、Krippendorff's α）及其計算範圍；信度不足時如何處理。**審查者不得代為推測信度數值。**
      - **效度與詮釋**：類目效度、構念效度；結論是否超出文本所能支持的範圍，是否把「文本中出現」等同於「社會影響」或「作者意圖」。
      - **分析方法**：描述統計、檢定或質性主題分析是否適當，量化內容分析是否有適當的百分比與樣本基數說明。
      - 權重調整建議：C 25%、D 25%、B 10%、F 5%

      ### 類型 7：歷史途徑（historical）
      - **史料來源與史料批判**：一手與二手史料是否區分；檔案、文獻、口述或報刊來源是否可查（館藏、卷宗、頁碼、版本）；是否對史料的真偽、作者立場、形成脈絡與可靠度進行批判。
      - **時序與因果敘事**：分期與關鍵時刻的依據是否清楚；是否交代因果機制（如過程追蹤、路徑依賴、關鍵轉折、偶然性），而不是僅按時間羅列事件。
      - **分析框架與史觀**：理論或概念框架是否明示並貫穿全文；有無目的論、後見之明或以今律古的傾向。
      - **替代解釋與反事實**：是否處理競爭性歷史解釋與學術爭議，並說明為何本文解釋較有說服力。
      - **證據與論斷對應**：關鍵論斷是否有史料直接支持；史料引述是否準確、脈絡完整，有無斷章取義。
      - **學術對話**：是否與既有史學與相關領域研究對話，指出本文的增補或修正。
      - **審查者不得憑記憶斷言史實或補充史料。** 只能指出「稿件所述史實缺少出處」或「稿件內部前後矛盾」。
      - 權重調整建議：B 20%、C 15%、D 25%、E 20%、A 10%、F 5%

      ### 類型 8：制度比較（institutional_comparison）
      - **案例選擇與可比性**：選擇邏輯（最相似、最相異或其他）、案例數量與時間範圍是否合理，案例間是否具備可比的基礎。
      - **比較維度與概念操作化**：制度概念（如半總統制、憲政體制）如何定義與操作化；比較維度、變數或指標是否明確並一致使用。
      - **因果機制與制度脈絡**：制度與政治結果之間的機制是否交代；是否區分正式制度與非正式制度、制度設計與運作實況。
      - **替代解釋與混淆因素**：是否處理制度以外的因素（政黨體系、選舉制度、歷史與文化脈絡、行為者策略）。
      - **比較的對稱性**：各案例是否同等深度、同一架構地被處理，避免只對一方做深度描述。
      - **條文與資料準確性**：憲法與法規條文、修憲年份、制度設計的引述，須有明確出處與版本日期；稿件內部不得前後矛盾。**審查者不得憑記憶斷言條文內容。**
      - **外推與限制**：結論對其他案例的適用範圍是否節制；是否承認案例數量有限對推論的限制。
      - 權重調整建議：C 20%、D 20%、E 20%、A 15%、B 15%、F 5%

      ### 類型 9：跨文化研究（cross_cultural）
      適用於跨國、跨族群、跨語言或跨文化群體的比較、跨文化適應／溝通／教學、量表跨文化施測等研究。
      - **文化概念的界定**：「文化」是以國家、族群、語言、宗教或價值取向哪一種單位界定？是否避免把國籍等同於文化、把群體內差異抹平（本質化、刻板印象）；採用的文化理論或維度（如價值維度、高低脈絡等）是否交代其適用範圍與已知批評，而不是當作定論套用。
      - **可比性與等值性**：概念等值（同一構念在不同文化中是否同義）、測量等值（量表是否做過跨文化信效度或測量不變性檢驗）、樣本等值（年齡、教育、階層、施測情境是否可比）、語言等值。**審查者不得代為推測等值性檢驗的結果。**
      - **翻譯與施測程序**：量表或訪談題綱的翻譯方式（如回譯、專家審查、試測）、施測語言、訪談者的語言與文化身分是否交代；翻譯造成的語意落差是否討論。
      - **詮釋的位置性**：研究者的文化位置與可能的偏見是否自覺；資料詮釋是否以研究對象自身脈絡為主，避免以單一文化標準評價另一方（emic／etic 的取捨是否交代）。
      - **替代解釋**：群體差異是否可能來自文化以外的因素（經濟、制度、世代、語言能力、調查方法、社會期許）；有無過度歸因於「文化差異」。
      - **抽樣與外推**：樣本是否足以代表所稱的文化群體；便利樣本（如學生）是否被推論到整個文化；結論的適用範圍是否節制。
      - **倫理與敏感性**：跨國或跨族群資料蒐集的同意與在地倫理審查是否交代；用語是否避免污名化。倫理判定由主管機關或審查委員會為準，審查者僅提醒稿件有無說明。
      - **審查者不得憑記憶斷言各文化的特徵、跨國統計數據或文化理論的指標值。** 只能指出「稿件所述缺少出處」或「稿件內部前後矛盾」。
      - 權重調整建議：B 20%、C 20%、D 20%、E 15%、A 15%、F 5%

      ### 類型 10：文學與語言研究（literature_linguistics）
      適用於文學作品／文本詮釋、比較文學、翻譯研究、語言學（語料、語用、話語分析、語言教學、二語習得等）。語言學中屬量化實驗、問卷、語料統計的部分，**另同時適用類型 1 或類型 6 的檢查項目**。
      - **研究問題與論點**：是否提出可論證、可被文本檢驗的論點，而不只是作品導讀、現象羅列或主觀感想；與既有詮釋、批評或理論爭議的關係是否清楚。
      - **文本／語料的界定**：研究對象的版本、底本、譯本、語料庫來源、時間與語域、選取理由與規模是否交代；所引原文的版本與頁碼（或語料編號）是否可查。
      - **理論架構與分析概念**：所用理論或分析框架（如敘事學、後殖民、認知語言學、語用學、系統功能語法等）是否被清楚界定並貫穿分析，而非只在緒論點名。
      - **細讀與證據**：論斷是否有文本證據直接支持；引文是否足量且脈絡完整、有無斷章取義；詮釋是否與引文實際內容相符；是否處理與論點相左的文本片段。
      - **語言與翻譯的處理**：外語原文、轉寫、譯文的呈現是否一致；譯文出自何人、是否為自譯並加以標示；對意義依賴原文詞彙處，是否附原文並說明翻譯造成的差異。
      - **語言分析方法**（語言學研究適用）：語料的標註與分析程序、參與者與實驗刺激、統計檢定與效果量是否交代；語料例句是否說明來源與判斷方式。**審查者不得代為推測標註一致性、統計數值或語料規模。**
      - **替代詮釋與限制**：是否承認文本可有多種詮釋、是否說明本文詮釋的邊界；結論是否把單一作品或單一語料的觀察推及整個作家、時代或語言。
      - **學術對話**：是否與該領域主要論述對話並指出本文的增補，而不是以普及性資料取代學術文獻。
      - **審查者不得憑記憶斷言作品情節、文句內容、作者生平、版本資訊或語言事實。** 只能指出「引文缺少出處或頁碼」「稿件內部前後矛盾」「論斷與稿件所引文字不相符」。
      - 權重調整建議：B 20%、C 10%、D 25%、E 25%、A 15%、F 5%（C 在純文本詮釋中指「研究取徑與文本選擇」；語言學實證研究請回復為 C 20%、D 25%）

      ---

      ## 四、問題嚴重度定義

      | 等級 | 定義 | 範例 |
      |---|---|---|
      | **critical** | 不解決就無法刊登 | 缺少應有的倫理說明；結論與證據相悖；疑似虛構引文；數據或事實前後矛盾 |
      | **major** | 明顯削弱論文品質，審查委員很可能要求修改 | 研究問題與分析不對應；方法關鍵細節缺漏；推論過度 |
      | **minor** | 改善後更好，但不影響採用 | 用詞、段落銜接、個別格式問題 |

      ---

      ## 五、審查結論（verdict）與停止條件

      ### verdict 對應

      | verdict | 條件 |
      |---|---|
      | accept | 無 critical、無 major，且各面向 ≥ 4 |
      | minor | 無 critical，major ≤ 1，且各面向 ≥ 3.5 |
      | major | 無 critical，但有 2 個以上 major |
      | reject | 有 critical 且無法在修訂中合理解決 |

      加權總分 = Σ（面向分數 × 權重）。

      ### 迴圈停止條件（任一成立即停止，交由人工審閱）

      1. **通過**：連續兩輪，兩位審查者的 verdict 皆為 accept 或 minor，且無 critical 與 major。
      2. **輪數上限**：已達 4 輪（可調整），輸出「未解決清單」。
      3. **停滯**：連續兩輪加權總分進步 < 0.1，且 major 數量未減少。
      4. **分歧**：兩位審查者同一面向分數相差 ≥ 2 分，或 verdict 差兩級以上。

      ---

      ## 六、期刊特定規範（請依目標期刊填寫）

      > 本節在系統中由兩種來源之一提供：①使用者上傳的期刊格式檔（經整理後送入審查流程）；②內建預設格式。以下欄位僅供手動使用時參考。以官方稿約為準，不可由模型自行補寫。

      - 期刊全名：＿＿＿＿＿＿
      - 論文類型（第三節，共 8 類）：＿＿＿＿＿＿
      - 稿件類型與字數限制：＿＿＿＿＿＿
      - 摘要字數與關鍵詞數：＿＿＿＿＿＿
      - 引註格式（例：APA 第七版）：＿＿＿＿＿＿
      - 匿名審查要求（是否須隱去作者與計畫資訊）：＿＿＿＿＿＿
      - 官方審查表項目（逐項貼上）：＿＿＿＿＿＿
      - AI 使用揭露規定：＿＿＿＿＿＿

